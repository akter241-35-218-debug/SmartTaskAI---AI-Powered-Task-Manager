<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartTask AI – Register</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="register">
  <div id="navbar"></div>
  <main class="container">
    <div class="auth-wrap">
      <div class="card">
        <h1>Create account</h1>
        <p class="subtitle">Start managing tasks with AI</p>
        <form id="registerForm">
          <div class="form-group"><label for="name">Name</label><input type="text" id="name" name="name" required></div>
          <div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" required></div>
          <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" required></div>
          <div class="form-group"><label for="confirm">Confirm Password</label><input type="password" id="confirm" name="confirm" required></div>
          <div class="error-text" id="formError"></div>
          <button class="btn" type="submit" style="width:100%">Register</button>
        </form>
        <p class="auth-switch">Already account ache? <a href="login.html">Login</a></p>
      </div>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/mock.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
