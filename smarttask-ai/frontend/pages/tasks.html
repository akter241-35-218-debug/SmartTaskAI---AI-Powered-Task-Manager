<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartTask AI – My Tasks</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="tasks" data-protected="true">
  <div id="navbar"></div>
  <main class="container">
    <h1>My Tasks</h1>
    <p class="subtitle">Task add koro, AI priority ar suggestion nijei set hobe</p>

    <div class="card">
      <h2>Add New Task</h2>
      <form id="addForm">
        <div class="form-group"><label for="title">Task</label><input type="text" id="title" name="title" placeholder="e.g. Complete Java Assignment Tomorrow" required></div>
        <div class="form-row">
          <div class="form-group"><label for="description">Description (optional)</label><input type="text" id="description" name="description"></div>
          <div class="form-group"><label for="deadline">Deadline (optional)</label><input type="date" id="deadline" name="deadline"></div>
        </div>
        <button class="btn" type="submit">Add Task</button>
      </form>
    </div>

    <div class="card">
      <div class="filters">
        <select id="filterStatus"><option value="all">All status</option><option value="pending">Pending</option><option value="completed">Completed</option></select>
        <select id="filterPriority"><option value="all">All priority</option><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option></select>
      </div>
      <div id="taskList"></div>
    </div>
  </main>

  <div class="modal-backdrop" id="editModal">
    <div class="modal">
      <h2>Edit Task</h2>
      <form id="editForm">
        <input type="hidden" name="id">
        <div class="form-group"><label>Task</label><input type="text" name="title" required></div>
        <div class="form-group"><label>Description</label><input type="text" name="description"></div>
        <div class="form-row">
          <div class="form-group"><label>Deadline</label><input type="date" name="deadline"></div>
          <div class="form-group"><label>Priority</label><select name="priority"><option>High</option><option>Medium</option><option>Low</option></select></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="cancelEdit">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/mock.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/tasks.js"></script>
</body>
</html>
